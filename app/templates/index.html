<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSV Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 48px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #6b7280;
            margin-bottom: 32px;
            font-size: 15px;
        }

        .upload-zone {
            border: 2px dashed #c7d2fe;
            border-radius: 14px;
            padding: 32px 20px;
            background: #f8f9ff;
            transition: all 0.2s ease;
        }

        .upload-zone:hover {
            border-color: #667eea;
            background: #f0f1ff;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .hint {
            margin-top: 20px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">💬📊</div>
        <h1>CSV Chat</h1>
        <p class="subtitle">Upload a CSV and ask questions about it in plain English</p>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            <div class="upload-zone">
                <input type="file" name="file" accept=".csv" required>
                <button type="submit">Upload & Analyze</button>
            </div>
        </form>

        <p class="hint">Supports .csv files only</p>
    </div>
</body>
</html>
