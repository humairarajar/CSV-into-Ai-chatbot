<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSV Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Inter', sans-serif;
        background: #f6f4ef;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #2b2926;
    }

    .card {
        background: #fffefc;
        border: 1px solid #e8e3d8;
        border-radius: 16px;
        padding: 48px 44px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 24px 60px rgba(43, 41, 38, 0.08);
        text-align: center;
        animation: floatIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatIn {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .kicker {
        display: inline-block;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8a7f6a;
        margin-bottom: 18px;
    }

    h1 {
        font-family: 'Fraunces', serif;
        font-size: 32px;
        font-weight: 600;
        color: #221f1c;
        margin-bottom: 12px;
        letter-spacing: -0.01em;
    }

    p.subtitle {
        color: #7a7466;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 34px;
        max-width: 300px;
        margin-left: auto;
        margin-right: auto;
    }

    .upload-zone {
        border: 1px solid #e8e3d8;
        border-radius: 12px;
        padding: 28px 22px;
        background: #faf8f3;
        transition: border-color 0.25s ease, background 0.25s ease;
    }

    .upload-zone:hover {
        border-color: #a89c7f;
        background: #f5f1e8;
    }

    input[type="file"] {
        width: 100%;
        font-family: 'Inter', sans-serif;
        font-size: 13.5px;
        padding: 9px 4px;
        margin-bottom: 18px;
        color: #3f3b34;
    }

    button {
        background: #221f1c;
        color: #fffefc;
        border: none;
        padding: 14px 28px;
        border-radius: 9px;
        font-family: 'Inter', sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        width: 100%;
        transition: background 0.25s ease, transform 0.15s ease;
    }

    button:hover {
        background: #8a6f4e;
        transform: translateY(-1px);
    }

    button:active { transform: translateY(0); }

    .hint {
        margin-top: 22px;
        font-size: 12px;
        color: #a89c88;
        letter-spacing: 0.02em;
    }
</style>
</head>
<body>
    <div class="card">
        <span class="kicker">Data, in conversation</span>
        <h1>CSV Chat</h1>
        <p class="subtitle">Upload a spreadsheet and ask about it in plain English — no formulas required.</p>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            <div class="upload-zone">
                <input type="file" name="file" accept=".csv" required>
                <button type="submit">Upload &amp; analyze</button>
            </div>
        </form>

        <p class="hint">CSV files only · always free</p>
    </div>
</body>
</html>
