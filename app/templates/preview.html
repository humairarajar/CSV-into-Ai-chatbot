<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSV Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 32px 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 16px;
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: #f0f1ff;
            color: #4c51bf;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .columns-text {
            margin-top: 12px;
            font-size: 13px;
            color: #6b7280;
            word-break: break-word;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .card h3 {
            font-size: 15px;
            color: #374151;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        .clear-btn:hover {
            color: #667eea;
        }

        table.preview-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }

        table.preview-table th, table.preview-table td {
            border: 1px solid #eee;
            padding: 8px 12px;
            text-align: left;
        }

        table.preview-table th {
            background-color: #f8f9ff;
            color: #4c51bf;
            font-weight: 600;
        }

        table.preview-table tr:hover {
            background-color: #fafafa;
        }

        #chat-form {
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        #question:focus {
            border-color: #667eea;
        }

        #chat-form button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        #chat-form button:hover {
            transform: translateY(-2px);
        }

        #chat-form button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #chat-history {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-question {
            align-self: flex-end;
            background: #667eea;
            color: white;
            padding: 10px 16px;
            border-radius: 12px 12px 2px 12px;
            font-size: 14px;
            max-width: 80%;
        }

        .msg-answer {
            align-self: flex-start;
            background: #f8f9ff;
            color: #1a1a2e;
            padding: 12px 16px;
            border-radius: 12px 12px 12px 2px;
            font-size: 14px;
            max-width: 80%;
            white-space: pre-wrap;
        }

        .msg-answer.error {
            background: #fef2f2;
            color: #b91c1c;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #c7d2fe;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            display: inline-block;
            margin-top: 8px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
        }

        .back-link:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 {{ filename }}</h1>
            <div class="stats">
                <span class="stat-pill">{{ num_rows }} rows</span>
                <span class="stat-pill">{{ num_cols }} columns</span>
                <span class="stat-pill">{{ file_size_kb }} KB</span>
            </div>
            <p class="columns-text"><strong>Columns:</strong> {{ columns }}</p>
        </div>

        <div class="card">
            <h3>Preview (first 5 rows)</h3>
            {{ preview_table | safe }}
        </div>

        <div class="card">
            <div class="card-title-row">
                <h3>Ask a question about your data</h3>
                <button class="clear-btn" id="clear-btn">Clear chat</button>
            </div>
            <p style="font-size:12px; color:#9ca3af; margin-bottom:10px;">Tip: include the word "chart" or "graph" to get a visual</p>
            <form id="chat-form">
                <input type="text" id="question" name="question" placeholder="e.g. What is the average value?" required>
                <button type="submit" id="ask-btn">Ask</button>
            </form>
            <div id="chat-history"></div>
        </div>

        <a class="back-link" href="/">← Upload another file</a>
    </div>

    <script>
        const chatHistory = document.getElementById("chat-history");
        const askBtn = document.getElementById("ask-btn");

        document.getElementById("chat-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const questionInput = document.getElementById("question");
            const question = questionInput.value;
            const filename = "{{ filename }}";

            // Add the user's question to the chat history
            const questionBubble = document.createElement("div");
            questionBubble.className = "msg-question";
            questionBubble.innerText = question;
            chatHistory.appendChild(questionBubble);

            // Add a temporary "thinking" answer bubble with a spinner
            const answerBubble = document.createElement("div");
            answerBubble.className = "msg-answer";
            answerBubble.innerHTML = '<span class="spinner"></span>Thinking...';
            chatHistory.appendChild(answerBubble);

            questionInput.value = "";
            askBtn.disabled = true;
            answerBubble.scrollIntoView({ behavior: "smooth", block: "end" });

            const formData = new FormData();
            formData.append("question", question);
            formData.append("filename", filename);

            fetch("/ask", {
                method: "POST",
                body: formData,
            })
                .then((res) => res.text())
                .then((data) => {
                    // If the response is an image tag, render it as HTML; otherwise plain text
                    if (data.trim().startsWith("<img")) {
                        answerBubble.innerHTML = data;
                    } else {
                        answerBubble.innerText = data;
                        if (data.toLowerCase().includes("sorry") || data.toLowerCase().includes("error") || data.toLowerCase().includes("not sure")) {
                            answerBubble.classList.add("error");
                        }
                    }
                    askBtn.disabled = false;
                    answerBubble.scrollIntoView({ behavior: "smooth", block: "end" });
                })
                .catch(() => {
                    answerBubble.innerText = "Something went wrong. Please try again.";
                    answerBubble.classList.add("error");
                    askBtn.disabled = false;
                });
        });

        document.getElementById("clear-btn").addEventListener("click", function () {
            chatHistory.innerHTML = "";
        });
    </script>
</body>
</html>
