<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSV Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Inter', sans-serif;
        background: #f6f4ef;
        min-height: 100vh;
        padding: 32px 16px;
        color: #2b2926;
    }

    .container { max-width: 780px; margin: 0 auto; }

    .card {
        background: #fffefc;
        border: 1px solid #e8e3d8;
        border-radius: 14px;
        padding: 26px 30px;
        margin-bottom: 18px;
        box-shadow: 0 12px 32px rgba(43, 41, 38, 0.06);
        animation: floatIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .card:nth-of-type(2) { animation-delay: 0.06s; }
    .card:nth-of-type(3) { animation-delay: 0.12s; }

    @keyframes floatIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        font-family: 'Fraunces', serif;
        font-size: 21px;
        font-weight: 600;
        color: #221f1c;
        margin-bottom: 14px;
        word-break: break-all;
    }

    .stats { display: flex; gap: 8px; flex-wrap: wrap; }

    .stat-pill {
        background: #f5f1e8;
        color: #8a6f4e;
        padding: 5px 13px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: 600;
    }

    .columns-text {
        margin-top: 13px;
        font-size: 13px;
        color: #7a7466;
        line-height: 1.6;
        word-break: break-word;
    }

    .columns-text strong { color: #221f1c; }

    .card h3 {
        font-family: 'Inter', sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        color: #4a453d;
        margin-bottom: 14px;
    }

    .card-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
    }

    .card-title-row h3 { margin-bottom: 0; }

    .clear-btn {
        background: none;
        border: none;
        color: #a89c88;
        font-size: 12px;
        cursor: pointer;
        text-decoration: underline;
        transition: color 0.2s ease;
    }

    .clear-btn:hover { color: #8a6f4e; }

    table.preview-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        margin-top: 14px;
    }

    table.preview-table th, table.preview-table td {
        border: 1px solid #eee9dd;
        padding: 9px 12px;
        text-align: left;
    }

    table.preview-table th {
        background: #f5f1e8;
        color: #4a453d;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.02em;
    }

    table.preview-table tr:hover { background-color: #fbf9f4; }

    #chat-form { display: flex; gap: 10px; margin-top: 6px; }

    #question {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #e8e3d8;
        border-radius: 9px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s ease;
        background: #faf8f3;
    }

    #question:focus {
        border-color: #a89c7f;
        background: #fffefc;
    }

    #chat-form button {
        background: #221f1c;
        color: #fffefc;
        border: none;
        padding: 12px 24px;
        border-radius: 9px;
        font-family: 'Inter', sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.15s ease;
    }

    #chat-form button:hover {
        background: #8a6f4e;
        transform: translateY(-1px);
    }

    #chat-form button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .helper-text {
        font-size: 11.5px;
        color: #b3aa96;
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    #chat-history {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .msg-question, .msg-answer {
        animation: bubbleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        font-size: 14px;
        padding: 11px 16px;
        max-width: 80%;
        border-radius: 10px;
    }

    @keyframes bubbleIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .msg-question {
        align-self: flex-end;
        background: #221f1c;
        color: #fffefc;
        border-radius: 10px 10px 2px 10px;
    }

    .msg-answer {
        align-self: flex-start;
        background: #f5f1e8;
        color: #2b2926;
        border-radius: 10px 10px 10px 2px;
        white-space: pre-wrap;
    }

    .msg-answer.error {
        background: #fbeceb;
        color: #a34a3f;
    }

    .msg-answer img { border-radius: 8px; max-width: 100%; }

    .spinner {
        display: inline-block;
        width: 12px; height: 12px;
        border: 2px solid #e0d8c4;
        border-top-color: #8a6f4e;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link {
        display: inline-block;
        margin-top: 4px;
        color: #7a7466;
        font-size: 13.5px;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .back-link:hover { color: #8a6f4e; text-decoration: underline; }
</style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>{{ filename }}</h1>
            <div class="stats">
                <span class="stat-pill">{{ num_rows }} rows</span>
                <span class="stat-pill">{{ num_cols }} columns</span>
                <span class="stat-pill">{{ file_size_kb }} KB</span>
            </div>
            <p class="columns-text"><strong>Columns:</strong> {{ columns }}</p>
        </div>

        <div class="card">
            <h3>Preview — first 5 rows</h3>
            {{ preview_table | safe }}
        </div>

        <div class="card">
            <div class="card-title-row">
                <h3>Ask a question about your data</h3>
                <button class="clear-btn" id="clear-btn">Clear chat</button>
            </div>
            <form id="chat-form">
                <input type="text" id="question" name="question" placeholder="e.g. What is the average value?" required>
                <button type="submit" id="ask-btn">Ask</button>
            </form>
            <p class="helper-text">✦ Try adding "chart" or "graph" for a visual answer</p>
            <div id="chat-history"></div>
        </div>

        <a class="back-link" href="/">← Upload another file</a>
    </div>

    <script>
        const chatHistory = document.getElementById("chat-history");
        const askBtn = document.getElementById("ask-btn");

        document.getElementById("chat-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const questionInput = document.getElementById("question");
            const question = questionInput.value;
            const filename = "{{ filename }}";

            const questionBubble = document.createElement("div");
            questionBubble.className = "msg-question";
            questionBubble.innerText = question;
            chatHistory.appendChild(questionBubble);

            const answerBubble = document.createElement("div");
            answerBubble.className = "msg-answer";
            answerBubble.innerHTML = '<span class="spinner"></span>Thinking...';
            chatHistory.appendChild(answerBubble);

            questionInput.value = "";
            askBtn.disabled = true;
            answerBubble.scrollIntoView({ behavior: "smooth", block: "end" });

            const formData = new FormData();
            formData.append("question", question);
            formData.append("filename", filename);

            fetch("/ask", {
                method: "POST",
                body: formData,
            })
                .then((res) => res.text())
                .then((data) => {
                    if (data.trim().startsWith("<img")) {
                        answerBubble.innerHTML = data;
                    } else {
                        answerBubble.innerText = data;
                        if (data.toLowerCase().includes("sorry") || data.toLowerCase().includes("error") || data.toLowerCase().includes("not sure")) {
                            answerBubble.classList.add("error");
                        }
                    }
                    askBtn.disabled = false;
                    answerBubble.scrollIntoView({ behavior: "smooth", block: "end" });
                })
                .catch(() => {
                    answerBubble.innerText = "Something went wrong. Please try again.";
                    answerBubble.classList.add("error");
                    askBtn.disabled = false;
                });
        });

        document.getElementById("clear-btn").addEventListener("click", function () {
            chatHistory.innerHTML = "";
        });
    </script>
</body>
</html>
